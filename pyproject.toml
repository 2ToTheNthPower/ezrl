[project]
name = "ezrl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aaron Davis", email = "adavi2048@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dm-tree>=0.1.10",
    "pydantic>=2.13.5",
    "ray[default]>=2.58.0",
    "torch>=2.14.0",
]

[project.scripts]
ezrl = "ezrl:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]
